<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#eee8da">
    <meta name="description" content="查看儲存在此瀏覽器的貨幣戰爭攻略提交紀錄、全球服攻略碼與連結。">
    <title>本機提交紀錄｜貨幣戰爭攻略轉移</title>
    <script src="/theme-init.js?v=5"></script>
    <link rel="stylesheet" href="/styles.css?v=23">
    <script type="module" src="/history-page.js?v=1"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/" aria-label="貨幣戰爭攻略轉移首頁">
        <svg class="brand__mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="10" stroke="currentColor" stroke-width="1.5"/>
          <path d="m24 5 3.5 13.5L43 24l-15.5 5.5L24 43l-3.5-13.5L5 24l15.5-5.5L24 5Z" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="2.5" fill="currentColor"/>
        </svg>
        <span data-i18n="appName">貨幣戰爭攻略轉移</span>
      </a>
      <div class="header-controls">
        <a class="header-history-link" href="/">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m15 18-6-6 6-6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="header-history-link__label" data-i18n="backToSearch">返回攻略搜尋</span>
        </a>
        <button id="theme-toggle" class="theme-toggle" type="button">
          <svg class="icon theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="3.5" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="icon theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20.2 15.2A8 8 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <label class="locale-control">
          <span class="visually-hidden" data-i18n="localeLabel">介面語言</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 5h12M9 3v2m1.5 0c-.8 4-3.2 7-6.5 9m2-5c1.4 2.2 3.4 4 6 5m2-1 3 8m0-8 3 8m-5-3h4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="locale-select">
            <option value="zh-Hant">繁體中文</option>
            <option value="zh-Hans">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
    </header>

    <main class="history-page">
      <section class="history-page__intro" aria-labelledby="history-heading">
        <p class="panel-heading__eyebrow" data-i18n="historyEyebrow">此裝置</p>
        <h1 id="history-heading" data-i18n="historyHeading">本機提交紀錄</h1>
        <p data-i18n="historyPrivacy">只保存在這個瀏覽器，不會同步至其他裝置。</p>
        <a class="button button--secondary" href="/" data-i18n="backToSearch">返回攻略搜尋</a>
      </section>

      <section class="history-panel" aria-label="本機提交紀錄清單">
        <div class="history-panel__heading">
          <p class="history-panel__summary" data-i18n="historySummary">成功完成的提交會依時間由新至舊排列。</p>
          <button id="history-clear" class="button button--quiet" type="button" data-i18n="historyClear" hidden>清除紀錄</button>
        </div>
        <div id="history-list" class="history-list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__content">
        <p data-i18n="footer">紀錄只存在目前的瀏覽器；清除瀏覽資料也會移除這些紀錄。</p>
      </div>
      <div class="site-footer__actions">
        <div class="footer-links">
          <a href="/" data-i18n="backToSearch">返回攻略搜尋</a>
          <a href="/admin" data-i18n="adminConsole">管理員控制台</a>
        </div>
      </div>
    </footer>
  </body>
</html>
