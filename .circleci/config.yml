version: 2.1

jobs:
  test:
    parameters:
      node-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
    resource_class: small
    environment:
      CI: "true"
    steps:
      - checkout
      - run:
          name: Record checkout and runtime
          command: |
            mkdir -p test-results
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            {
              git rev-parse HEAD
              node --version
              npm --version
              uname -srm
            } | tee test-results/runtime.txt
      - run:
          name: Install locked dependencies
          command: npm ci --ignore-scripts
          no_output_timeout: 10m
      - run:
          name: Run complete test suite
          command: >-
            npm test --
            --test-reporter=spec
            --test-reporter=junit
            --test-reporter-destination=stdout
            --test-reporter-destination=test-results/junit.xml
          no_output_timeout: 10m
      - run:
          name: Format JUnit report for CircleCI
          when: always
          command: |
            node --input-type=module <<'NODE'
            import { readFile, writeFile } from 'node:fs/promises';
            const path = 'test-results/junit.xml';
            const xml = await readFile(path, 'utf8');
            // Node emits top-level testcases; CircleCI requires a testsuite parent.
            const report = xml
              .replace('<testsuites>', '<testsuites><testsuite name="node-tests">')
              .replace('</testsuites>', '</testsuite></testsuites>');
            await writeFile(path, report);
            NODE
      - when:
          condition:
            equal: ["22.23.4", << parameters.node-version >>]
          steps:
            - run:
                name: Audit high-severity dependencies
                command: npm audit --audit-level=high
                no_output_timeout: 10m
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  security-verification:
    jobs:
      - test:
          name: Linux / Node << matrix.node-version >>
          matrix:
            parameters:
              node-version: ["20.20.2", "22.23.4", "24.18.0"]
