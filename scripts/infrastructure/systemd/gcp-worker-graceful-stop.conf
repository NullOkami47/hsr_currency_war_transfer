# Install as a drop-in for the existing production-worker service only.
# Keep its preflight, user, environment, sandbox and stop timeout unchanged.
[Service]
ExecStart=
ExecStart=/usr/bin/flock --no-fork --nonblock --conflict-exit-code 75 /var/lib/hsr-transfer-worker-staging/login/.production-worker.flock /opt/node-v24.22.3-linux-x64/bin/node /opt/hsr-transfer-worker-staging/scripts/worker-server.mjs
# TERM goes to Node; it owns browser shutdown. A stop timeout must leave live
# processes and their locks intact for reconciliation, without escalation to KILL.
KillMode=mixed
SendSIGKILL=no
