[Unit]
Description=GCP production encrypted state backup and guarded local retention

[Service]
ExecStart=
ExecStart=/usr/bin/flock --nonblock --conflict-exit-code 75 /run/hsr-worker-backup.flock /usr/bin/env HSR_BACKUP_FLOCK_HELD=1 /bin/sh /opt/hsr-transfer-worker-staging/scripts/infrastructure/gcp-backup-and-retain.sh
